[package]
name = "agent-voice"
version = "0.4.8"
edition = "2021"
build = "build.rs"
description = "Native Windows voice notifications for agent harnesses"

[[bin]]
name = "AgentVoice"
path = "native/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
msedge-tts = "0.4.1"
windows = { version = "0.62", features = ["Win32_Media_Speech", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Media_Multimedia", "Win32_Security_Cryptography"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
